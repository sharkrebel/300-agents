<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f28"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc65c"/>
      <stop offset="1" stop-color="#e8930c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="494.5" height="494.5" rx="115" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- glow -->
  <g opacity="0.35" filter="url(#soft)" stroke="#f0a832" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M148 168 L252 256 L148 344"/>
  </g>

  <!-- terminal prompt: chevron + cursor bar -->
  <path d="M148 168 L252 256 L148 344" fill="none" stroke="url(#amber)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="292" y="318" width="98" height="42" rx="12" fill="url(#amber)"/>

  <!-- three agent nodes -->
  <circle cx="316" cy="150" r="17" fill="#eceef1"/>
  <circle cx="368" cy="150" r="17" fill="#eceef1" opacity="0.62"/>
  <circle cx="420" cy="150" r="17" fill="#eceef1" opacity="0.30"/>
</svg>
